[project]
name = "trace-xai"
version = "0.1.0"
description = "TRACE-XAI: evidence-grounded explainability for AI-agent behavior (synthetic banking research sandbox)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# NOTE: the project venv uses --system-site-packages; langchain-core is pinned
# in the venv because the shared site-packages ships an incompatible core 1.x.
dependencies = [
    "pydantic>=2.5,<3",
    "pyyaml>=6",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3.26,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-ollama>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "llm: tests that require the local Ollama daemon (skipped if unreachable)",
]
